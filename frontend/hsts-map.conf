# Arkitekturportalen – when to send Strict-Transport-Security.
#
# Installed as /etc/nginx/conf.d/00-ea-hsts.conf (http context, read before
# default.conf) and used by security-headers.conf. HSTS goes out only when the
# request came over https – to nginx itself ($scheme) or to the proxy in front
# (X-Forwarded-Proto, its first value). A plain-http installation gets no
# HSTS and so is never locked out. A client that forges X-Forwarded-Proto on
# plain http gains nothing: browsers ignore HSTS received over http.
map "$scheme:$http_x_forwarded_proto" $ea_hsts {
    ~^https:                "max-age=31536000";
    "~*^[a-z]*:\s*https"    "max-age=31536000";
    default                 "";
}
