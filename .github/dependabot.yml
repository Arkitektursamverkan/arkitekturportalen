version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 (the native compiler) is not supported by
      # typescript-eslint 8 (peer: typescript <6.1). Remove when it is.
      - dependency-name: "typescript"
        versions: [">= 7.0.0"]
      # MUI 5 → 9 removes the system props (mb, alignItems … on Box, Stack,
      # Typography), *Props in favour of slotProps and some icons: about 950
      # type errors in 120 files. It needs its own migration (codemods plus
      # a visual review), not a Dependabot bump. Remove when that is done.
      - dependency-name: "@mui/material"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@mui/icons-material"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # Only even-numbered Node releases get long-term support; stay on LTS.
      - dependency-name: "node"
        versions: ["25.x", "27.x", "29.x"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
