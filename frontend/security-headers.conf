# Arkitekturportalen – security headers for every answer from nginx.
#
# Included by the template's server block and again in every location that
# sets its own add_header (nginx drops inherited add_header lines there). An
# installation with its own nginx config can include it too:
#     include /etc/nginx/ea/security-headers.conf;
#
# Content-Security-Policy, what the app needs:
# - script-src 'self': the bundle and /config.js; index.html has no inline script.
# - style-src 'unsafe-inline': MUI/emotion write <style> elements at runtime;
#   fonts.googleapis.com for the theme's Google font (startApp.tsx).
# - img-src https:: a logo may be any https address (Settings).
# - connect-src/frame-src: Entra sign-in (MSAL's hidden iframe), Microsoft
#   Graph and SharePoint downloads; blob: frames show PDFs (PdfViewerWindow).
# - object-src 'self' blob:: a PDF in a blob: frame inherits this policy and
#   Chromium's PDF viewer counts as an object there – 'none' would block it.
#
# Strict-Transport-Security only over https: $ea_hsts is empty otherwise, and
# nginx leaves out a header with an empty value. It is defined in
# hsts-map.conf (the image has it as /etc/nginx/conf.d/00-ea-hsts.conf); a
# config of your own that includes this file without that one in conf.d must
# define $ea_hsts itself.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://login.microsoftonline.com https://graph.microsoft.com https://*.sharepoint.com; frame-src 'self' blob: https://login.microsoftonline.com https://*.sharepoint.com; worker-src 'self' blob:; object-src 'self' blob:; base-uri 'self'; frame-ancestors 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security $ea_hsts always;
