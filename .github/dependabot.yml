# Månadsvis, och mindre uppdateringar samlade i en pull request per
# paketsystem: varje pull request kör CI, och Actions-minuterna är begränsade.
# Nya huvudversioner kommer var för sig. Säkerhetsuppdateringar kommer som
# förut, direkt.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      sma-uppdateringar:
        update-types: ["minor", "patch"]
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      sma-uppdateringar:
        update-types: ["minor", "patch"]
    ignore:
      # TypeScript 7 (the native compiler) is not supported by
      # typescript-eslint 8 (peer: typescript <6.1). Remove when it is.
      - dependency-name: "typescript"
        versions: [">= 7.0.0"]
      # The types follow the Node version in the image (24, LTS), not the latest.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      sma-uppdateringar:
        update-types: ["minor", "patch"]
  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      sma-uppdateringar:
        update-types: ["minor", "patch"]
    ignore:
      # Only even-numbered Node releases get long-term support; stay on LTS.
      - dependency-name: "node"
        versions: ["25.x", "27.x", "29.x"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      sma-uppdateringar:
        update-types: ["minor", "patch"]
