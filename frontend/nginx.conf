# Arkitekturportalen – generic nginx config (plain HTTP on port 80).
#
# TLS is expected in front of this (a reverse proxy or load balancer), or in
# an installation's own overlay that mounts its own config and certificates.

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # index.html is also MSAL's redirect bridge: Entra's sign-in response lands
    # here (auth/redirectBridge.ts), so the page must never be stored.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }

    location /api {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Written at container start from the environment – never cache it, or a
    # changed setting would need every browser's cache cleared.
    location = /config.js {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(js|css|png|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /locales/ {
        add_header Cache-Control "no-cache";
    }
}
